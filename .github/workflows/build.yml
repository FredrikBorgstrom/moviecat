name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact: MovieCat-macos.zip
          - os: windows-latest
            target: windows
            artifact: MovieCat-windows-x64.zip
          # The oldest supported Ubuntu LTS, so the AppImage runs on older glibc too.
          - os: ubuntu-22.04
            target: linux
            artifact: MovieCat-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release

      - name: Package (macOS)
        if: matrix.target == 'macos'
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/MovieCat.app ${{ matrix.artifact }}

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ${{ matrix.artifact }}

      - name: Installer (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ([0-9.]+)').Matches[0].Groups[1].Value
          iscc /DAppVersion=$version windows\installer\moviecat.iss
          Move-Item build\installer\MovieCat-windows-x64-setup.exe .

      # Microsoft Store package. Runs once the Store identity from Partner Center
      # is set as repository variables MSIX_IDENTITY_NAME and MSIX_PUBLISHER.
      - name: MSIX for the Microsoft Store (Windows)
        if: matrix.target == 'windows' && vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ([0-9.]+)').Matches[0].Groups[1].Value
          dart run msix:create --store --build-windows false --version "$version.0" `
            --identity-name "${{ vars.MSIX_IDENTITY_NAME }}" --publisher "${{ vars.MSIX_PUBLISHER }}" `
            --output-path . --output-name MovieCat-windows-x64-store

      - name: Package (Linux)
        if: matrix.target == 'linux'
        run: tar -czf ${{ matrix.artifact }} -C build/linux/x64/release/bundle .

      - name: AppImage (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get install -y desktop-file-utils
          id=io.github.fredrikborgstrom.moviecat
          app=AppDir
          mkdir -p $app/usr/bin $app/usr/share/applications $app/usr/share/metainfo $app/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/. $app/usr/bin/
          cp linux/packaging/$id.desktop $app/usr/share/applications/
          cp linux/packaging/$id.desktop $app/
          cp linux/packaging/$id.metainfo.xml $app/usr/share/metainfo/
          cp linux/packaging/$id.png $app/usr/share/icons/hicolor/256x256/apps/
          cp linux/packaging/$id.png $app/
          printf '#!/bin/sh\nhere="$(dirname "$(readlink -f "$0")")"\nexec "$here/usr/bin/moviecat" "$@"\n' > $app/AppRun
          chmod +x $app/AppRun
          desktop-file-validate $app/$id.desktop
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run $app MovieCat-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            MovieCat-windows-x64-setup.exe
            MovieCat-windows-x64-store.msix
            MovieCat-x86_64.AppImage
          if-no-files-found: ignore

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}
            MovieCat-windows-x64-setup.exe
            MovieCat-x86_64.AppImage
          fail_on_unmatched_files: false
          generate_release_notes: true

      # Chocolatey package: packed on every build, pushed for v* tags once the
      # CHOCOLATEY_API_KEY secret is set. Runs after the installer is on the release.
      - name: Chocolatey package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ([0-9.]+)').Matches[0].Groups[1].Value
          $checksum = (Get-FileHash MovieCat-windows-x64-setup.exe -Algorithm SHA256).Hash
          Copy-Item -Recurse packaging/chocolatey choco
          foreach ($f in 'choco/moviecat.nuspec', 'choco/tools/chocolateyinstall.ps1') {
            (Get-Content $f -Raw).Replace('{{VERSION}}', $version).Replace('{{CHECKSUM}}', $checksum) | Set-Content $f -NoNewline
          }
          choco pack choco/moviecat.nuspec --outputdirectory .
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:CHOCOLATEY_API_KEY) {
            choco push "moviecat.$version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          }

  # Snap Store package from the Linux bundle. Published to the stable channel for
  # v* tags once the SNAPCRAFT_STORE_CREDENTIALS secret is set.
  snap:
    needs: build
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MovieCat-linux-x64.tar.gz
          path: linux-artifact
      - run: mv linux-artifact/MovieCat-linux-x64.tar.gz .
      - uses: snapcore/action-build@v1
        id: snap
      - uses: actions/upload-artifact@v4
        with:
          name: moviecat-snap
          path: ${{ steps.snap.outputs.snap }}
      - uses: snapcore/action-publish@v1
        if: startsWith(github.ref, 'refs/tags/v') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: stable

  # AUR package moviecat-bin, updated for v* tags once the AUR_SSH_PRIVATE_KEY
  # secret is set. Uses the release assets, so it runs after the build jobs.
  aur:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.AUR_SSH_PRIVATE_KEY != ''
      - name: Set version
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          version=${GITHUB_REF_NAME#v}
          sed -i -e "s/^pkgver=.*/pkgver=$version/" -e "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        if: env.AUR_SSH_PRIVATE_KEY != ''
        with:
          pkgname: moviecat-bin
          pkgbuild: packaging/aur/PKGBUILD
          updpkgsums: true
          commit_username: Fredrik Borgström
          commit_email: fredrik@abcx3.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ github.ref_name }}
